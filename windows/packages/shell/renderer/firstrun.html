<!doctype html>
<!-- packages/shell/renderer/firstrun.html - one-time setup: one screen (language, data folder, two options). -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:;">
  <title>Setup</title>
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="firstrun.css">
</head>
<body>
  <div class="setup">
    <main class="setup-body">
      <header class="setup-head">
        <div class="head-text">
          <h1 id="title"></h1>
          <p class="muted" data-i18n="firstRun.simple.subtitle"></p>
        </div>
        <div class="seg" id="langs" role="radiogroup" aria-label="Language / Język">
          <button type="button" data-lang="pl" role="radio">Polski</button>
          <button type="button" data-lang="en" role="radio">English</button>
        </div>
      </header>

      <section class="group">
        <label class="lbl" for="baseDir" data-i18n="firstRun.folder.title"></label>
        <div class="row">
          <input type="text" id="baseDir" spellcheck="false">
          <button type="button" class="btn" id="browse" data-i18n="firstRun.folder.browse"></button>
        </div>
        <div class="hint"><span data-i18n="firstRun.simple.savedIn"></span> <code id="dataDir">—</code></div>
        <div class="err" id="folderErr" role="alert"></div>
        <div class="hint ok-note" id="existingNote" hidden data-i18n="firstRun.folder.existing"></div>
      </section>

      <!-- Only when Windows DPAPI is unavailable: the key then needs a password. -->
      <section class="group" id="pwBox" hidden>
        <label class="lbl" for="masterPw" data-i18n="firstRun.simple.pwTitle"></label>
        <div class="row">
          <input type="password" id="masterPw" spellcheck="false" autocomplete="new-password" data-i18n-ph="firstRun.security.masterPlaceholder">
          <input type="password" id="masterPw2" spellcheck="false" autocomplete="new-password" data-i18n-ph="firstRun.security.masterRepeat">
        </div>
        <div class="err" id="masterErr" role="alert"></div>
        <div class="hint" data-i18n="firstRun.security.masterHint"></div>
      </section>

      <section class="opts">
        <label class="opt">
          <span class="opt-text"><b data-i18n="firstRun.simple.updates"></b><small class="muted" data-i18n="firstRun.simple.updatesDesc"></small></span>
          <input type="checkbox" class="switch" id="autoUpdate" checked>
        </label>
        <label class="opt">
          <span class="opt-text"><b data-i18n="firstRun.simple.ip"></b><small class="muted" data-i18n="firstRun.simple.ipDesc"></small></span>
          <input type="checkbox" class="switch" id="ipConsent">
        </label>
      </section>

      <section class="opts" id="shortcutsBox" hidden>
        <div class="opt-title"><b data-i18n="firstRun.shortcuts.title"></b><small class="muted" data-i18n="firstRun.shortcuts.desc"></small></div>
        <label class="opt" id="shortcutBrowserRow">
          <span class="opt-text"><b>Octo.su</b><small class="muted" data-i18n="firstRun.shortcuts.browser"></small></span>
          <input type="checkbox" class="switch" id="shortcutBrowser">
        </label>
        <label class="opt" id="shortcutDetectRow">
          <span class="opt-text"><b>OctoDetect.su</b><small class="muted" data-i18n="firstRun.shortcuts.detect"></small></span>
          <input type="checkbox" class="switch" id="shortcutDetect">
        </label>
      </section>

      <p class="hint" data-i18n="firstRun.simple.local"></p>
    </main>

    <footer class="setup-foot">
      <span class="status" id="globalErr" role="status"></span>
      <span class="version" id="version"></span>
      <button type="button" class="btn" id="cancel" data-i18n="common.cancel"></button>
      <button type="button" class="btn primary" id="next" data-i18n="firstRun.simple.start"></button>
    </footer>
  </div>
  <script src="firstrun.js"></script>
</body>
</html>
