# apps/octodetect/electron-builder.yml - packaging of OctoDetect.su (Windows x64).
# Produces a portable folder (win-unpacked) + zip; the suite installer (installer/octosuite.iss)
# wraps both apps. All code is pre-bundled by tools/build.mjs, so no node_modules are shipped.
appId: su.octo.detect
productName: OctoDetect.su
executableName: OctoDetect.su
copyright: Copyright © 2026 OctoSuite contributors
electronVersion: 44.4.5
directories:
  output: ../../release/octodetect
  buildResources: build-resources
files:
  - package.json
  - dist/**/*
  - "!dist/**/*.map"
asar: true
npmRebuild: false
nodeGypRebuild: false
buildDependenciesFromSource: false
extraResources:
  - from: ../../licenses
    to: licenses
win:
  icon: dist/assets/icon.ico
  target:
    - target: dir
      arch: [x64]
    - target: zip
      arch: [x64]
  # Code signing: set CSC_LINK / CSC_KEY_PASSWORD (never commit the certificate).
  signAndEditExecutable: true
  requestedExecutionLevel: asInvoker
# Electron fuses (hardening of the Electron binary itself).
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  loadBrowserProcessSpecificV8Snapshot: false
  grantFileProtocolExtraPrivileges: false
publish: null
