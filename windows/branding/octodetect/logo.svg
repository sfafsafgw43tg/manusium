<?xml version="1.0" encoding="UTF-8"?>
<!-- branding/octodetect/logo.svg - OctoDetect.su logo (original artwork, MPL-2.0 project asset).
     Dark-slate octagon with a teal/emerald ring, concentric "scan" arcs and a lens handle. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="od-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <radialGradient id="od-core" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#0f2f36"/>
      <stop offset="1" stop-color="#07161a"/>
    </radialGradient>
  </defs>
  <path d="M84 12h88l72 72v88l-72 72H84l-72-72V84z" fill="url(#od-ring)"/>
  <path d="M92 32h72l60 60v72l-60 60H92l-60-60V92z" fill="url(#od-core)"/>
  <!-- lens -->
  <circle cx="116" cy="116" r="50" fill="none" stroke="url(#od-ring)" stroke-width="12"/>
  <!-- scan arcs inside the lens (abstract fingerprint) -->
  <g fill="none" stroke="#99f6e4" stroke-width="6" stroke-linecap="round" opacity="0.85">
    <path d="M92 124a24 24 0 0 1 48-8"/>
    <path d="M104 134a12 12 0 0 1 24-6"/>
    <path d="M84 104a36 36 0 0 1 62-4"/>
  </g>
  <!-- handle -->
  <path d="M152 152l38 38" stroke="url(#od-ring)" stroke-width="18" stroke-linecap="round"/>
</svg>
