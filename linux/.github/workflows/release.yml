# .github/workflows/release.yml
#
# Builds, signs and publishes an OctoSuite release when a tag v<version> is
# pushed (the tag must equal "version" in package.json).
#
# Required repository secret:
#   UPDATE_SIGNING_KEY   content of keys/update-private-key.pem (from `npm run keygen`)
# Optional secrets:
#   UPDATE_KEY_PASSPHRASE  passphrase of the key (when OCTO_KEY_PASSPHRASE was used)
#   CSC_LINK / CSC_KEY_PASSWORD  Authenticode certificate (base64 .pfx) for the app exes
#   OCTO_SIGNTOOL                full signtool command for the installer ($f = file)
#
# sign-manifest refuses to sign when the secret does not match the public key
# committed in packages/core/src/update-public-key.ts, so a wrong key can
# never produce a release that installed apps would reject.

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  native-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run stage:firefox:linux
      - run: npm run test:native-packaged
      - run: npm run test:native-firefox-packaged

  release:
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check tag, version and signing key
        shell: pwsh
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME does not match package.json version $version" }
          if (-not $env:UPDATE_SIGNING_KEY) { throw 'Secret UPDATE_SIGNING_KEY is missing (content of keys/update-private-key.pem).' }
          if ((Get-Content -Raw packages/core/src/update-public-key.ts) -notmatch 'BEGIN PUBLIC KEY') { throw 'No public key committed - run npm run keygen and commit update-public-key.ts + scripts/lib/update-public-key.pem.' }

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run i18n:check

      - name: Package both apps
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist

      - name: Verify staged packaged Chromium runtime
        run: npm run test:native-packaged:windows

      - run: node tools/check-fuses.mjs

      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }

      - name: Build installer
        env:
          OCTO_SIGNTOOL: ${{ secrets.OCTO_SIGNTOOL }}
        run: npm run installer

      - name: Sign manifest (key only exists in this step's temp folder)
        shell: pwsh
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          OCTO_KEY_PASSPHRASE: ${{ secrets.UPDATE_KEY_PASSPHRASE }}
        run: |
          $key = Join-Path $env:RUNNER_TEMP 'update-private-key.pem'
          try {
            [System.IO.File]::WriteAllText($key, $env:UPDATE_SIGNING_KEY)
            $env:OCTO_UPDATE_PRIVATE_KEY = $key
            $notes = 'release-notes.json'
            if (Test-Path $notes) { node tools/sign-manifest.mjs --severity recommended --notes $notes }
            else { node tools/sign-manifest.mjs --severity recommended --notes-en "OctoSuite update" --notes-pl "Aktualizacja OctoSuite" }
            if ($LASTEXITCODE -ne 0) { throw 'sign-manifest failed' }
          } finally { Remove-Item -LiteralPath $key -Force -ErrorAction SilentlyContinue }

      - name: Checksums
        run: |
          node tools/hash-files.mjs
          node tools/hash-files.mjs --verify

      - name: Installer E2E on the final artifacts
        shell: pwsh
        run: ./tools/ci/installer-e2e.ps1

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          gh release create "v$version" --title "OctoSuite $version" --generate-notes `
            "release/OctoSuite-Setup-$version.exe" release/latest.json release/latest.json.sig release/SHA256SUMS.txt
