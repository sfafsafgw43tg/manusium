<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="styles.css">
  <title>PrOximAl Editor</title>
</head>
<body class="popup-body">
  <main class="popup">
    <div class="brand-row"><img src="icons/icon-32.png" alt=""><span>PrOximAl <small>EDITOR</small></span></div>
    <p class="popup-lead">Lokalna przestrzeń dokumentów i danych testowych.</p>
    <button id="open-workspace" class="button primary">Otwórz przestrzeń</button>
    <button id="fill-form" class="button">Wypełnij bieżący formularz</button>
    <p id="profile-state" class="tiny">Sprawdzam aktywny zestaw…</p>
    <p id="popup-status" class="status" aria-live="polite"></p>
    <p class="tiny divider">Działa na karcie, którą wybierzesz. Nie wysyła formularza ani danych do sieci.</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
